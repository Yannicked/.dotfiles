# ~/.config/tmux/tmux.conf

# --- General -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # true colour
set -as terminal-features ",xterm*:usstyle" # undercurl + coloured underlines (nvim diagnostics)
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                    # short Esc delay (nvim); 0 leaks terminal DA replies into panes
set -g focus-events on                    # nvim autoread etc.
set -g set-clipboard on                   # OSC 52 clipboard, works over ssh
set -g display-time 2000

# Number windows/panes from 1, keep numbering gapless
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window titles
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S: #W"

# --- Keys --------------------------------------------------------------------
# Prefix stays C-b (default). To use C-a instead, uncomment:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits / new windows keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Seamless C-h/j/k/l between tmux panes and nvim splits, M-h/j/k/l to resize
# both (smart-splits.nvim + backend-tmux set @pane-is-vim while nvim runs).
# Edge behaviour "stop" matches move.at_edge in nvim.
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "if -F '#{pane_at_left}' '' 'select-pane -L'"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "if -F '#{pane_at_top}' '' 'select-pane -U'"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "if -F '#{pane_at_right}' '' 'select-pane -R'"
bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 3"
bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 3"
bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"
bind -T copy-mode-vi C-h if -F '#{pane_at_left}' '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}' '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}' '' 'select-pane -R'

# Quick window switching
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Copy mode: vi keys, v to select, y to yank (to system clipboard via OSC 52)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Appearance (gruvbox dark, matches nvim) ---------------------------------
# bg0_h #1d2021  bg1 #3c3836  bg2 #504945  gray #928374  fg #ebdbb2
# yellow #fabd2f  orange #fe8019  aqua #8ec07c  red #fb4934
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1d2021,fg=#a89984"
set -g status-left "#[bg=#fabd2f,fg=#1d2021,bold] #S #[bg=#1d2021] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=#fe8019]PREFIX ,}#[fg=#928374]#h #[bg=#3c3836,fg=#ebdbb2] %H:%M "
set -g status-right-length 50
setw -g window-status-format "#[fg=#928374] #I:#W "
setw -g window-status-current-format "#[bg=#504945,fg=#ebdbb2,bold] #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-activity-style "fg=#fe8019"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#3c3836,fg=#fabd2f"
set -g message-command-style "bg=#3c3836,fg=#8ec07c"
setw -g mode-style "bg=#fabd2f,fg=#1d2021"
set -g display-panes-active-colour "#fabd2f"
set -g display-panes-colour "#504945"
setw -g clock-mode-colour "#fabd2f"
