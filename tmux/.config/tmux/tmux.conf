# ~/.config/tmux/tmux.conf

# --- General -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # true colour
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                    # short Esc delay (nvim); 0 leaks terminal DA replies into panes
set -g focus-events on                    # nvim autoread etc.
set -g set-clipboard on                   # OSC 52 clipboard, works over ssh
set -g display-time 2000

# Number windows/panes from 1, keep numbering gapless
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window titles
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S: #W"

# --- Keys --------------------------------------------------------------------
# Prefix stays C-b (default). To use C-a instead, uncomment:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits / new windows keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Seamless C-h/j/k/l between tmux panes and nvim splits (vim-tmux-navigator)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Quick window switching
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Copy mode: vi keys, v to select, y to yank (to system clipboard via OSC 52)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Appearance --------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=colour244"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour244]#h  %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour255,bold] #I:#W#{?window_zoomed_flag, [Z],} "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g message-style "bg=default,fg=colour39"
setw -g mode-style "bg=colour39,fg=colour16"
